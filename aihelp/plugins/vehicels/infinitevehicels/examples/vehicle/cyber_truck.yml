id: cyber-truck
name: 'Cyber Truck'

exit-shortcut:
  operator: CROUCH

model: cyber-truck
upgrade: ground-vehicle-upgrades

item-storage-slots: 4

fuel:
  capacity: 100.0
  min-consumption: 0.02
  max-consumption: 0.05

controllers:
  main:
    id: ground-vehicle

pickup-item: 'cyber-truck-spawner'

physics:
  # whether can float on liquid surfaces
  floats: false
  
  gravity:
    maximum: 2.48
    acceleration: 0.040
  
  friction:
    air: 10
    on-unknown: 70
    on-solid: 70
    on-dusty: 40
    on-snowy: 40
    on-slippery: 30
    on-water: 20
    on-lava: 30
    through-water: 50
    through-lava: 90

  climbing:
    block-climb-capacity: 1