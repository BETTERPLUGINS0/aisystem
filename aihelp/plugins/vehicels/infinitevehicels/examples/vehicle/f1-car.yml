    on-unknown: 70
    on-solid: 70
    on-dusty: 40
    on-snowy: 40
    on-slippery: 30
    on-water: 20
    on-lava: 30
    through-water: 50
    through-lava: 90

  climbing:
    block-climb-capacity: 1